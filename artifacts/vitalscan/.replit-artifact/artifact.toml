kind = "web"
previewPath = "/"
title = "PreCURE"
description = "A multi-tenant PreCURE wellness scanning platform with role-based consoles, credit-ledger management, simulated vital scans, consent-gated results, kiosk mode, analytics, and seeded demo data."
version = "1.0.0"
id = "artifacts/vitalscan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23277

[services.development]
run = "pnpm --filter @workspace/vitalscan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vitalscan", "run", "build" ]
serve = "static"
publicDir = "artifacts/vitalscan/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23277"
BASE_PATH = "/"
